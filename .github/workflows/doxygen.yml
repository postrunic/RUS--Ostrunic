name: Generiraj Doxygen dokumentaciju

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Instaliraj Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generiraj dokumentaciju
        run: |
          cd Lab1
          doxygen Doxyfile

      - name: Objavi na GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Lab1/docs/html